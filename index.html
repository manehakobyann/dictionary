<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lingora — AI Language Dictionary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">LINGORA</div>
        <div class="tagline">Words • Meanings • Languages</div>
    </header>

    <main>

        <section class="hero">

            <p class="small-title">AI LANGUAGE DICTIONARY</p>

            <h1>
                Discover the meaning<br>
                behind every word.
            </h1>

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search any word..."
                >

                <button id="searchButton">
                    SEARCH
                </button>

            </div>

            <p class="hint">
                Search in English, Armenian, Turkish or another language.
            </p>

        </section>


        <section id="result" class="result hidden">

            <div class="word-header">

                <div>
                    <h2 id="word"></h2>
                    <span id="phonetic"></span>
                </div>

                <button id="audioButton" class="audio-button">
                    🔊
                </button>

            </div>


            <div class="info-grid">

                <!-- PART OF SPEECH -->

                <div class="card">
                    <span class="label">
                        PART OF SPEECH
                    </span>

                    <p id="partOfSpeech"></p>
                </div>


                <!-- ENGLISH MEANING -->

                <div class="card">
                    <span class="label">
                        MEANING
                    </span>

                    <p id="meaning"></p>
                </div>


                <!-- ARMENIAN WORD -->

                <div class="card">
                    <span class="label">
                        ARMENIAN
                    </span>

                    <p id="armenian"></p>
                </div>


                <!-- ARMENIAN DEFINITION -->

                <div class="card">
                    <span class="label">
                        ARMENIAN DEFINITION
                    </span>

                    <p id="armenianDefinition">
                        Translating...
                    </p>
                </div>


                <!-- SYNONYMS -->

                <div class="card">
                    <span class="label">
                        SYNONYMS
                    </span>

                    <p id="synonyms"></p>
                </div>


                <!-- ANTONYMS -->

                <div class="card">
                    <span class="label">
                        ANTONYMS
                    </span>

                    <p id="antonyms"></p>
                </div>


                <!-- EXAMPLE -->

                <div class="card example-card">

                    <span class="label">
                        EXAMPLE
                    </span>

                    <p id="example"></p>

                    <p id="armenianExample"></p>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
